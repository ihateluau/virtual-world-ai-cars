<!DOCTYPE html>
<html>
    <head>
        <title>World Editor</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <h1>World Editor</h1>
        <canvas id="myCanvas"></canvas>

        <div id="controls">
            <button onclick="dispose()">Clear</button>
            <button onclick="save()">Save</button>
        </div>

        <script src="js/world.js"></script>
        <script src="js/graphEditor.js"></script>
        <script src="js/viewport.js"></script>
        <script src="js/math/graph.js"></script>
        <script src="js/math/utils.js"></script>
        <script src="js/primitives/point.js"></script>
        <script src="js/primitives/segment.js"></script>
        <script src="js/primitives/polygon.js"></script>
        <script src="js/primitives/envelope.js"></script>
        <script>
            
            myCanvas.width = 600;
            myCanvas.height = 600;

            const context = myCanvas.getContext("2d");

            const graphString = localStorage.getItem("graph");
            const graphInfo = graphString ? JSON.parse(graphString) : null;
            const graph = graphInfo 
                ? Graph.load(graphInfo)
                : new Graph();
            const world = new World(graph);

            const viewport = new Viewport(myCanvas);

            const graphEditor = new GraphEditor(viewport, graph);

            // generating a hash to check whenever the graph changes
            let oldGraphHash = graph.hash();

            animate();

            function animate() { // clears the canvas and then redraw it each time
                viewport.reset();
                if (graph.hash() != oldGraphHash) {                
                    world.generate();
                    oldGraphHash = graph.hash(); // generate a new hash for the graph
                }
                world.draw(context);
                context.globalAlpha = 0.3
                graphEditor.display();
                requestAnimationFrame(animate); // recursion, re-call the function each frame
            }

            function dispose() {
                graphEditor.dispose();
            }

            function save() {
                localStorage.setItem("graph", JSON.stringify(graph))
            }
        </script>
    </body>
</html>
